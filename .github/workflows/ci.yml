name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, screenshots, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The screenshot tour is part of the unit tests: with REBUILD_SCREENS set it renders every main screen in light,
      # dark, 200% text and landscape with Robolectric.
      - name: Unit tests and screenshot tour
        env:
          REBUILD_SCREENS: ${{ github.workspace }}/app/build/screens
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease

      # Signed with the runner's own debug key: for checking the build, not for installing over the phone's app.
      - name: Release build
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Summary
        if: always()
        run: python3 .github/scripts/test_summary.py "Unit tests" app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screens/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ci-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  device-tests:
    name: Device tests (API 33 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build first so the emulator's time is spent only on tests.
      - name: Build the app and its tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      # The same shape as the development emulator: API 33, 1080 × 2400 at 420 dpi.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Summary
        if: always()
        run: python3 .github/scripts/test_summary.py "Device tests" app/build/outputs/androidTest-results/connected >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
