name: Release

# Publishes a signed APK when a version tag (v0.1.16) is pushed. The APK is signed with the same key as every earlier
# Rebuild build, so it installs over the app on the phone and keeps its data; the workflow refuses to publish anything
# signed with another key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the signing certificate every Rebuild APK has been signed with since 0.1.0.
  EXPECTED_CERT_SHA256: d834bba6e23b6dc1dfab6f213ec474d0ec02dbd2699e1012824757c94642365b

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REBUILD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the REBUILD_KEYSTORE_BASE64 secret first (see docs/ci.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rebuild.keystore"
          echo "REBUILD_KEYSTORE_FILE=$RUNNER_TEMP/rebuild.keystore" >> "$GITHUB_ENV"

      - name: Unit tests, lint and signed release build
        env:
          REBUILD_KEYSTORE_PASSWORD: ${{ secrets.REBUILD_KEYSTORE_PASSWORD }}
          REBUILD_KEY_ALIAS: ${{ secrets.REBUILD_KEY_ALIAS }}
          REBUILD_KEY_PASSWORD: ${{ secrets.REBUILD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK isn't signed with Rebuild's key, so it wouldn't install over the existing app."
            exit 1
          fi

      - name: Package
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rebuild-$VERSION.apk"
          (cd dist && sha256sum "rebuild-$VERSION.apk" > SHA256SUMS)
          rm -f "$RUNNER_TEMP/rebuild.keystore"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Rebuild $VERSION" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Rebuild $VERSION" --generate-notes --verify-tag
          fi
