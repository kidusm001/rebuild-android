name: Release

# Continuous delivery: whenever CI passes on main and app/build.gradle.kts carries a versionName that has no release
# yet, this tags that commit v<versionName> and publishes the signed APK. A merge that doesn't bump the version
# releases nothing. Pushing a v* tag by hand still works too. The APK is signed with the same key as every earlier
# Rebuild build, so it installs over the app on the phone and keeps its data; nothing signed with another key is
# ever published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the signing certificate every Rebuild APK has been signed with since 0.1.0.
  EXPECTED_CERT_SHA256: d834bba6e23b6dc1dfab6f213ec474d0ec02dbd2699e1012824757c94642365b

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only a CI run that passed on a push to main (not a pull request), or a hand-pushed tag.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide what to release
        id: decide
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts."
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; this merge didn't bump the version, so there's nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        if: steps.decide.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.REBUILD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the REBUILD_KEYSTORE_BASE64 secret first (see docs/ci.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rebuild.keystore"
          echo "REBUILD_KEYSTORE_FILE=$RUNNER_TEMP/rebuild.keystore" >> "$GITHUB_ENV"

      - name: Unit tests, lint and signed release build
        if: steps.decide.outputs.skip != 'true'
        env:
          REBUILD_KEYSTORE_PASSWORD: ${{ secrets.REBUILD_KEYSTORE_PASSWORD }}
          REBUILD_KEY_ALIAS: ${{ secrets.REBUILD_KEY_ALIAS }}
          REBUILD_KEY_PASSWORD: ${{ secrets.REBUILD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify the signing certificate
        if: steps.decide.outputs.skip != 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK isn't signed with Rebuild's key, so it wouldn't install over the existing app."
            exit 1
          fi

      - name: Package
        if: steps.decide.outputs.skip != 'true'
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rebuild-$VERSION.apk"
          (cd dist && sha256sum "rebuild-$VERSION.apk" > SHA256SUMS)
          rm -f "$RUNNER_TEMP/rebuild.keystore"

      - name: Publish the release
        if: steps.decide.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "Rebuild $VERSION" --notes-file "$notes" --target "$SHA"
          else
            gh release create "$TAG" dist/* --title "Rebuild $VERSION" --generate-notes --target "$SHA"
          fi
